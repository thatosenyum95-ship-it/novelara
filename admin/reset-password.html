<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — Novelara</title><link rel="stylesheet" href="../assets/css/admin.css">  <meta name="robots" content="noindex,nofollow">
</head>
<body class="login-page"><main class="login-card">
<div class="brand-mark">N</div><p class="eyebrow">NOVELARA ADMIN</p><h1>Buat password baru.</h1>
<p class="muted">Masukkan password baru untuk akun Admin Novelara.</p>
<form id="resetForm">
<label>Password baru<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter"></label>
<label>Ulangi password<input id="password2" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password"></label>
<button id="resetBtn" type="submit">Simpan Password Baru</button>
<p id="resetMessage" class="form-message" role="alert"></p>
</form>
<a class="back-link" href="login.html">← Kembali ke Login Admin</a>
</main>
<script type="module">
import { supabase } from '../assets/js/supabase.js';
const form=document.getElementById('resetForm'), btn=document.getElementById('resetBtn'), msg=document.getElementById('resetMessage');
const {data:{session}}=await supabase.auth.getSession();
if(!session){msg.textContent='Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link reset baru.';form.querySelectorAll('input,button').forEach(el=>el.disabled=true);}
form.addEventListener('submit',async e=>{
 e.preventDefault(); msg.textContent='';
 const p=document.getElementById('password').value, p2=document.getElementById('password2').value;
 if(p!==p2){msg.textContent='Kedua password tidak sama.';return;}
 btn.disabled=true;btn.textContent='Menyimpan…';
 const {error}=await supabase.auth.updateUser({password:p});
 if(error){msg.textContent=error.message;btn.disabled=false;btn.textContent='Simpan Password Baru';return;}
 await supabase.auth.signOut();
 msg.textContent='Password berhasil diubah. Mengarahkan ke login…';
 setTimeout(()=>location.replace('login.html'),1200);
});
</script><script src="../assets/js/theme.js"></script>
</body></html>
