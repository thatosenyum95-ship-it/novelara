<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark — Novelara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/bookmarks.js"></script>
<style>
.page{padding:42px 0 76px}.head{margin-bottom:28px}.head h1{font:400 clamp(2.4rem,6vw,4rem)/1.05 "DM Serif Display",serif;color:#39282d;margin:0 0 8px}.head p{color:#88777c;margin:0}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #eee2e5;border-radius:16px;padding:18px;display:flex;gap:15px;align-items:center}.cover{width:78px;aspect-ratio:3/4.2;border-radius:10px;background:linear-gradient(145deg,#e8c1ca,#a8586c);color:#fff;padding:10px;box-sizing:border-box;display:flex;align-items:flex-end;font:400 1rem/1.05 "DM Serif Display",serif}.info{min-width:0;flex:1}.info h2{font:400 1.25rem/1.15 "DM Serif Display",serif;color:#422f35;margin:0 0 5px}.info p{color:#938187;font-size:.75rem;margin:0 0 10px}.actions{display:flex;gap:7px}.btn{border:1px solid #e5d8db;border-radius:9px;background:#fff;color:#765762;padding:7px 9px;text-decoration:none;font:700 .7rem Manrope,sans-serif;cursor:pointer}.empty{padding:55px 20px;text-align:center;border:1px dashed #dccbd0;border-radius:16px;color:#89777d}.empty strong{display:block;color:#594249;font:400 1.6rem "DM Serif Display",serif;margin-bottom:7px}.ad{margin:30px 0;min-height:90px;display:flex;align-items:center;justify-content:center;border:1px dashed #d9c7cc;border-radius:14px;color:#a49398;background:#fcf9fa;font-size:.76rem}
@media(max-width:850px){.list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.page{padding-top:28px}.list{grid-template-columns:1fr}}
</style><meta name="robots" content="noindex,nofollow">
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">Novelara</a><nav><a href="index.html">Beranda</a><a href="novels.html">Novel</a><a href="#genre">Genre</a><a href="bookmarks.html" aria-current="page">Bookmark</a></nav></div></header>
<main class="container page"><header class="head"><h1>Novel Favorit</h1><p>Semua cerita yang kamu simpan ada di sini. ❤️</p></header><section class="list" id="list"></section><div class="empty" id="empty"><strong>Belum ada bookmark</strong>Simpan novel favoritmu untuk menemukannya lagi dengan mudah.</div><div class="ad" data-ad-position="bookmarks">AREA IKLAN — DIATUR DARI ADMIN</div></main>
<footer class="site-footer"><div class="container"><p>© 2026 Novelara. Cerita yang menemukan hati.</p></div></footer>
<script>
const list=document.getElementById('list'),empty=document.getElementById('empty');
function render(){const items=NovelaraBookmarks.get();list.innerHTML='';empty.style.display=items.length?'none':'block';items.forEach(item=>{const el=document.createElement('article');el.className='card';el.innerHTML='<div class="cover">Novelara</div><div class="info"><h2></h2><p></p><div class="actions"><a class="btn" href="'+item.url+'">Baca Novel</a><button class="btn remove">Hapus</button></div></div>';el.querySelector('h2').textContent=item.title;el.querySelector('p').textContent=item.author+' · '+item.genre;el.querySelector('.remove').onclick=()=>{NovelaraBookmarks.toggle(item);render()};list.appendChild(el)})}
render();
</script>
<script type="module">
import { supabase } from './assets/js/supabase.js';
import { escapeHtml, renderAd } from './assets/js/reader.js';
const list=document.getElementById('list'), empty=document.getElementById('empty');
async function load(){
 renderAd(document.querySelector('[data-ad-position="bookmarks"]'),'bookmarks');
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){list.innerHTML='';empty.style.display='block';empty.innerHTML='<strong>Login untuk melihat bookmark</strong>Bookmark tersimpan di akunmu dan dapat dibuka dari perangkat mana pun.';return;}
 const {data,error}=await supabase.from('bookmarks').select('created_at,novel:novels(id,title,slug,author_name)').eq('user_id',user.id).order('created_at',{ascending:false});
 if(error){console.error(error);return;}
 empty.style.display=data?.length?'none':'block';
 list.innerHTML=(data||[]).map(x=>'<article class="card"><div class="cover">Novelara</div><div class="info"><h2>'+escapeHtml(x.novel?.title||'Novel')+'</h2><p>'+escapeHtml(x.novel?.author_name||'Novelara')+'</p><div class="actions"><a class="btn" href="novel.html?slug='+encodeURIComponent(x.novel?.slug||'')+'">Baca Novel</a><button class="btn remove" data-id="'+x.novel.id+'">Hapus</button></div></div></article>').join('');
 list.querySelectorAll('.remove').forEach(btn=>btn.addEventListener('click',async()=>{await supabase.from('bookmarks').delete().eq('user_id',user.id).eq('novel_id',btn.dataset.id);load();}));
}
load();
</script>
<script src="assets/js/theme.js"></script>
</body></html>
