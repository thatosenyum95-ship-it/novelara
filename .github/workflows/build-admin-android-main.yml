name: Build Novelara Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Admin APK branch
        uses: actions/checkout@v4
        with:
          ref: admin-apk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Use Admin Capacitor config
        run: cp capacitor.admin.config.ts capacitor.config.ts

      - name: Add Android platform
        run: npx cap add android

      - name: Apply ADMIN icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/admin-icon.svg android/app/src/main/res/drawable/admin_icon.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('@mipmap/ic_launcher', '@drawable/admin_icon')
          s = s.replace('@mipmap/ic_launcher_round', '@drawable/admin_icon')
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable Admin APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: novelara-admin-debug-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
