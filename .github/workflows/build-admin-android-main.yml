name: Build Novelara Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Admin APK branch
        uses: actions/checkout@v4
        with:
          ref: admin-apk
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Add Android platform
        run: npx cap add android --config capacitor.admin.config.ts
      - name: Sync Capacitor
        run: npx cap sync android --config capacitor.admin.config.ts
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
