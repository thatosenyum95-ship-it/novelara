name: Build Novelara Admin APK

on:
  push:
    branches: [admin-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform for Admin
        run: npx cap add android --config capacitor.admin.config.ts

      - name: Sync Capacitor Admin
        run: npx cap sync android --config capacitor.admin.config.ts

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Generate release signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/novelara-admin-release.keystore" \
            -storepass android -keypass android \
            -alias novelara-admin -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Novelara Admin, OU=Novelara, O=Novelara, L=Pontianak, ST=West Kalimantan, C=ID"

      - name: Sign and verify release APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/Novelara-Admin-release.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$ZIPALIGN" -f -p 4 "$APK" app-release-aligned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/novelara-admin-release.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" app-release-aligned.apk
          "$APKSIGNER" verify --verbose "$SIGNED"
          rm -f app-release-aligned.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: novelara-admin-release
          path: android/app/build/outputs/apk/release/Novelara-Admin-release.apk
          if-no-files-found: error
