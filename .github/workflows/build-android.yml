name: Build Novelara Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install Novelara app icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-anydpi
          cp assets/novelara-icon.xml android/app/src/main/res/drawable/novelara_icon.xml
          cat > android/app/src/main/res/drawable/novelara_icon_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#7C3AED"/>
          </shape>
          EOF
          cat > android/app/src/main/res/drawable/novelara_icon_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M29,25c0,-3.3 2.7,-6 6,-6h38c3.3,0 6,2.7 6,6v58c0,3.3 -2.7,6 -6,6H35c-3.3,0 -6,-2.7 -6,-6z"/>
              <path android:fillColor="#EDE9FE" android:pathData="M35,19h5v70h-5z"/>
              <path android:fillColor="#7C3AED" android:pathData="M45,34h7l11,25V34h7v40h-7L52,49v25h-7z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/novelara_icon_bg"/>
              <foreground android:drawable="@drawable/novelara_icon_fg"/>
          </adaptive-icon>
          EOF
          cp assets/novelara-icon.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelara-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
