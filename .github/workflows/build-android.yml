name: Build Novelara Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install final Novelara app icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-anydpi
          cp assets/novelara-icon.xml android/app/src/main/res/drawable/novelara_icon.xml
          cat > android/app/src/main/res/drawable/novelara_icon_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#6D28D9" android:endColor="#C4B5FD" android:angle="315"/>
          </shape>
          EOF
          cat > android/app/src/main/res/drawable/novelara_icon_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M25,31C25,27 28,24 32,24H50V84H32C28,84 25,81 25,77z"/>
              <path android:fillColor="#F5F3FF" android:pathData="M83,31C83,27 80,24 76,24H58V84H76C80,84 83,81 83,77z"/>
              <path android:fillColor="#DDD6FE" android:pathData="M52,25h4v60h-4z"/>
              <path android:fillColor="#4C1D95" android:pathData="M35,37h6l7,13V37h6v34h-6L41,54v17h-6z"/>
              <path android:fillColor="#EC4899" android:pathData="M31,76C43,68 55,68 77,73C69,79 56,82 42,82C37,82 33,80 31,76z"/>
              <path android:fillColor="#F472B6" android:pathData="M73,27c2,-4 7,-4 8,0c1,-4 6,-4 7,0c1,5 -7,9 -8,10c-1,-1 -9,-5 -8,-10z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,21h3v9h-3zM15,24h9v3h-9z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M88,70h2v6h-2zM86,72h6v2h-6z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/novelara_icon_bg"/>
              <foreground android:drawable="@drawable/novelara_icon_fg"/>
          </adaptive-icon>
          EOF
          cp assets/novelara-icon.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelara-android-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
